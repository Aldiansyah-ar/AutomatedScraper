name: Auto Scrape Detik

on:
  schedule:
    # Berjalan setiap hari pukul 00:00 WIB. 
    # Catatan: GitHub Actions menggunakan zona waktu UTC. 
    # 00:00 WIB = 17:00 UTC (hari sebelumnya). Maka ditulis '0 17 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch: # Memungkinkan Anda menjalankan skrip secara manual dari web GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      - name: Run scraper script
        run: python scrape.py

      - name: Commit and push changes to repository
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update hasil scraping otomatis" && git push)